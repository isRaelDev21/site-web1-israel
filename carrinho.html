<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho — COMPIA Editora</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">COMPIA <span>editora</span></a>
    <nav class="main-nav">
      <a href="index.html">Catálogo</a>
      <a href="conta.html">Minha Conta</a>
      <a href="carrinho.html" class="cart-link">Carrinho <span id="cart-count" class="cart-count">0</span></a>
    </nav>
  </div>
</header>

<main class="container cart-page">
  <div class="page-header">
    <h1>Seu carrinho</h1>
  </div>

  <div class="cart-layout">
    <div id="cart-items"></div>

    <div class="summary-box">
      <h3>Resumo do pedido</h3>
      <div class="shipping-box" id="shipping-box">
        <label>CEP para calcular o frete</label>
        <input type="text" id="cep-input" placeholder="00000-000" maxlength="9">
        <button class="btn btn-outline btn-sm btn-block" id="calc-shipping-btn">Calcular frete</button>
        <div id="shipping-options" style="margin-top:12px;"></div>
      </div>
      <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">R$ 0,00</span></div>
      <div class="summary-row"><span>Frete</span><span id="sum-shipping">a calcular</span></div>
      <div class="summary-row total"><span>Total</span><span id="sum-total">R$ 0,00</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:14px;">Finalizar compra</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; 2026 COMPIA Editora — Materiais de Inteligência Artificial, Blockchain e Cibersegurança.</p>
    <a href="admin.html" class="admin-link">Painel administrativo</a>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/cart.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
